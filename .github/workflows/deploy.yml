name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [developer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        # amitkarma.github.io is a user/org Pages site, served from the
        # root domain (https://amitkarma.github.io/) — no base-href subpath needed.
        run: npx ng build --configuration production --base-href /me/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular CLI outputs to dist/<project-name>/browser (Angular 17+).
          # <PROJECT_NAME> = the "projects" key in angular.json, which may
          # differ from the repo name. For older Angular (<17), drop /browser.
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
