<section class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="hero-eyebrow">
        <span class="dot"></span>
        Available for new opportunities
      </p>
      <h1 class="hero-name">{{ profile.name }}</h1>
      <h2 class="hero-title">{{ profile.title }}</h2>
      <p class="hero-intro">{{ profile.intro }}</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="assets/Amit_Karma_Resume.pdf" download="Amit_Karma_Resume.pdf">
          Download Resume
        </a>
        <a class="btn btn-outline" href="#contact">Contact Me</a>
      </div>
    </div>

    <div class="hero-panel" aria-hidden="true">
      <div class="panel-window">
        <div class="panel-dots"><span></span><span></span><span></span></div>
        <div class="panel-body">
          <p><span class="k">const</span> <span class="v">engineer</span> = {{ '{' }}</p>
          <p class="indent">role: <span class="s">'Technical Lead'</span>,</p>
          <p class="indent">experience: <span class="s">'7+ years'</span>,</p>
          <p class="indent">stack: [<span class="s">'Java'</span>, <span class="s">'Spring Boot'</span>, <span class="s">'Angular'</span>],</p>
          <p class="indent">focus: <span class="s">'scalable systems'</span></p>
          <p>{{ '}' }};</p>
        </div>
      </div>
    </div>
  </div>
</section>
